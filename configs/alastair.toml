api_key = "http://ollama:11434"
default_provider = "ollama"
default_model = "qwen3-coder-64k"
default_temperature = 0.7
provider_timeout_secs = 300

[channels_config]
cli = false
ack_reactions = true
show_tool_calls = false
session_persistence = true

[channels_config.signal]
http_url = "http://signal-alastair:8080"
account = "${ALASTAIR_PHONE}"
group_id = "${SIGNAL_GROUP_ID}"
allowed_from = ["*"]

[gateway]
port = 42617
host = "0.0.0.0"
allow_public_bind = true

[memory]
backend = "sqlite"
auto_save = true

[identity]
format = "openclaw"
