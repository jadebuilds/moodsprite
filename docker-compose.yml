networks:
  zeroclaw:
    driver: bridge

volumes:
  ollama-data:
    external: true
    name: openclaw-setup_ollama-data

services:
  # --- LLM ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [zeroclaw]
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # --- Signal CLI daemons ---
  signal-ghostwheel:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-ghostwheel
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8084:8080"
    entrypoint: []
    command:
      - signal-cli
      - "--config"
      - "/home/.local/share/signal-cli"
      - "-a"
      - "${GHOSTWHEEL_PHONE}"
      - "daemon"
      - "--http"
      - "0.0.0.0:8080"
    volumes:
      - ./data/signal/ghostwheel:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  signal-aya:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-aya
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8082:8080"
    entrypoint: []
    command:
      - signal-cli
      - "--config"
      - "/home/.local/share/signal-cli"
      - "-a"
      - "${AYA_PHONE}"
      - "daemon"
      - "--http"
      - "0.0.0.0:8080"
    volumes:
      - ./data/signal/aya:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  signal-alastair:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-alastair
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8083:8080"
    entrypoint: []
    command:
      - signal-cli
      - "--config"
      - "/home/.local/share/signal-cli"
      - "-a"
      - "${ALASTAIR_PHONE}"
      - "daemon"
      - "--http"
      - "0.0.0.0:8080"
    volumes:
      - ./data/signal/alastair:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # --- Agents ---
  ghostwheel:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_NAME: ghostwheel
    container_name: ghostwheel
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:42617:42617"
    env_file: .env
    environment:
      JIRON_PORT: "3100"
      LINEAR_API_KEY: "${LINEAR_API_KEY}"
      SIGNAL_HTTP_URL: "http://signal-ghostwheel:8080"
    depends_on:
      - ollama
      - signal-ghostwheel
    restart: unless-stopped

  aya:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_NAME: aya
    container_name: aya
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:42618:42617"
    env_file: .env
    environment:
      JIRON_PORT: "3200"
      SIGNAL_HTTP_URL: "http://signal-aya:8080"
    depends_on:
      - ollama
      - signal-aya
    restart: unless-stopped

  alastair:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        AGENT_NAME: alastair
    container_name: alastair
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3300:3300"
      - "127.0.0.1:42619:42617"
    env_file: .env
    environment:
      JIRON_PORT: "3300"
      SIGNAL_HTTP_URL: "http://signal-alastair:8080"
    depends_on:
      - ollama
      - signal-alastair
    restart: unless-stopped
