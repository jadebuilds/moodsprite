networks:
  zeroclaw:
    driver: bridge

volumes:
  ollama-data:
    external: true
    name: openclaw-setup_ollama-data

services:
  # --- LLM ---
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [zeroclaw]
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # --- Signal CLI instances ---
  # Using bbernhard REST API mode (MODE=normal) — provides /v1/receive, /v2/send
  # that the Zeroclaw SDK SignalClient expects.
  signal-ghostwheel:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-ghostwheel
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      - MODE=normal
    volumes:
      - ./data/signal/ghostwheel:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  signal-aya:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-aya
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - MODE=normal
    volumes:
      - ./data/signal/aya:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  signal-alastair:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-alastair
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - MODE=normal
    volumes:
      - ./data/signal/alastair:/home/.local/share/signal-cli
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # --- Agents ---
  ghostwheel:
    build:
      context: .
      args:
        AGENT_NAME: ghostwheel
    container_name: ghostwheel
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3100:3100"
    env_file: .env
    environment:
      SIGNAL_API_URL_GHOSTWHEEL: http://signal-ghostwheel:8080
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
      - signal-ghostwheel
    restart: unless-stopped

  aya:
    build:
      context: .
      args:
        AGENT_NAME: aya
    container_name: aya
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3200:3200"
    env_file: .env
    environment:
      SIGNAL_API_URL_AYA: http://signal-aya:8080
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
      - signal-aya
    restart: unless-stopped

  alastair:
    build:
      context: .
      args:
        AGENT_NAME: alastair
    container_name: alastair
    networks: [zeroclaw]
    ports:
      - "127.0.0.1:3300:3300"
    env_file: .env
    environment:
      SIGNAL_API_URL_ALASTAIR: http://signal-alastair:8080
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
      - signal-alastair
    restart: unless-stopped
